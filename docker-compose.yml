services:
  linkedin-mcp:
    build: .
    image: linkedin-mcp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ~/.linkedin-mcp:/home/pwuser/.linkedin-mcp
    environment:
      - LOG_LEVEL=WARNING
      # Optional browser proxy, passed through from the host environment or an
      # .env file. For a relay on the host use host.docker.internal, not
      # 127.0.0.1, which inside the container is the container itself.
      - PROXY_SERVER
      - PROXY_USERNAME
      - PROXY_PASSWORD
      - PROXY_BYPASS
    command:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --path
      - /mcp
